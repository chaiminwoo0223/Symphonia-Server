name: CI

on:
  pull_request:
    branches: [develop, main]
  # setup-gradle은 기본 브랜치 실행에서만 Gradle 캐시를 저장하고 PR 실행은 그 캐시를 읽기만 한다.
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # check-test-conventions.sh가 origin/develop과의 merge-base를 구하므로 전체 히스토리가 필요하다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # 로컬 pre-push 게이트와 같은 스크립트를 실행해 검증 기준을 하나로 유지한다.
      - run: ./.claude/scripts/check-all.sh
