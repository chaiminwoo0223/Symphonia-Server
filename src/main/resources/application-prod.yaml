spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  docker:
    compose:
      enabled: false
  jpa:
    show-sql: false

refresh-token:
  cookie-secure: true

# 기본값을 두지 않아, 변수를 빠뜨리면 localhost 링크를 보내지 않고 기동에 실패한다.
gathering:
  notification:
    link:
      base-url: ${GATHERING_LINK_BASE_URL}

logging:
  level:
    com.symphonia: info
