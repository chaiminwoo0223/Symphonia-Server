spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 300ms
      connect-timeout: 1s
  docker:
    compose:
      enabled: false
  jpa:
    show-sql: false

logging:
  level:
    com.symphonia: info

# prod에서는 API 명세와 Swagger UI를 만들지 않는다. SwaggerSecurityConfig도 이 값이 false이면 빠져 명세 경로가 열리지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
