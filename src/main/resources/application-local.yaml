# bootRun과 importCatalog에서는 spring-boot-docker-compose가 compose.yaml의 컨테이너를 띄우고, 그 연결이 아래 연결 정보보다 우선한다.
# spring.docker.compose.enabled=false로 실행하거나 jar로 실행할 때를 위해 compose.yaml과 같은 POSTGRES_* 변수로 명시한다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 300ms
      connect-timeout: 1s
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

refresh-token:
  cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}

notification:
  link:
    base-url: ${GATHERING_LINK_BASE_URL:http://localhost:5173/shares}

logging:
  level:
    com.symphonia: debug
