# bootRun과 importDrinks에서는 spring-boot-docker-compose가 compose.yaml의 컨테이너를 띄우고, 그 연결이 아래 연결 정보보다 우선한다.
# spring.docker.compose.enabled=false로 실행하거나 jar로 실행할 때를 위해 compose.yaml과 같은 POSTGRES_* 변수로 명시한다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

refresh-token:
  cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}

logging:
  level:
    com.symphonia: debug
