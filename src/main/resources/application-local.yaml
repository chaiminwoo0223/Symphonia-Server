# bootRun과 importCatalog에서는 spring-boot-docker-compose가 compose.yaml의 컨테이너를 띄우고, 그 연결이 아래 연결 정보보다 우선한다.
# spring.docker.compose.enabled=false로 실행하거나 jar로 실행할 때를 위해 compose.yaml과 같은 POSTGRES_* 변수로 명시한다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 300ms
      connect-timeout: 1s
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 개발 기기와 같은 네트워크의 다른 기기가 management 포트에 접근하지 못하게 한다.
# dev와 prod는 컨테이너 밖의 수집기와 헬스 확인이 접근해야 하므로 주소를 좁히지 않고 방화벽으로 막는다.
management:
  server:
    address: 127.0.0.1

logging:
  level:
    com.symphonia: debug
