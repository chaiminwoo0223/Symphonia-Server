# 로컬에서는 spring-boot-docker-compose가 compose.yaml의 컨테이너로 연결하므로 아래 연결 정보보다 compose 연결이 우선한다.
# compose 없이 실행할 때를 위해 compose.yaml과 같은 POSTGRES_* 변수로 명시한다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

refresh-token:
  cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}

logging:
  level:
    com.symphonia: debug
