spring:
  application:
    name: symphonia

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

access-token:
  secret: ${JWT_SECRET}
  expiration-time: ${ACCESS_TOKEN_EXPIRATION_TIME:7200}

refresh-token:
  expiration-time: ${REFRESH_TOKEN_EXPIRATION_TIME:604800}
