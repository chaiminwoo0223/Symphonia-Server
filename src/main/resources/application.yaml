spring:
  application:
    name: symphonia

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# LB 뒤에서 감사 로그에 실제 클라이언트 IP를 남기기 위해, 신뢰하는 프록시가 보낸 X-Forwarded-For만 반영한다.
# TRUSTED_PROXIES가 없으면 Spring Boot 기본값(사설 IP 대역)을 쓴다. 배포 시 LB 대역을 넣는다.
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "${TRUSTED_PROXIES:192.168.0.0/16, 172.16.0.0/12, 169.254.0.0/16, fc00::/7, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, fe80::/10, ::1/128}"

access-token:
  secret: ${JWT_SECRET}
  expiration-time: ${ACCESS_TOKEN_EXPIRATION_TIME:7200}

refresh-token:
  expiration-time: ${REFRESH_TOKEN_EXPIRATION_TIME:604800}
  cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    token-uri: https://oauth2.googleapis.com/token
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    issuer: https://accounts.google.com

# 음료 적재(./gradlew importDrinks)가 읽는 BJCP 원본. scripts/import/fetch-bjcp.sh로 받는다.
import:
  bjcp:
    path: ${BJCP_PATH:scripts/import/data/bjcp/bjcp_styleguide-2021.json}
