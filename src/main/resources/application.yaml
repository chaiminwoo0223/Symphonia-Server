spring:
  application:
    name: symphonia

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-expiration-time: ${JWT_ACCESS_EXPIRATION_TIME:7200}
  refresh-expiration-time: ${JWT_REFRESH_EXPIRATION_TIME:604800}
