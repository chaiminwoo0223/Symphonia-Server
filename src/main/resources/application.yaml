# 프로파일을 지정하지 않으면 local로 실행한다. dev, prod는 SPRING_PROFILES_ACTIVE로 반드시 지정한다.
spring:
  application:
    name: symphonia
  profiles:
    default: local

  # 배포 중 처리 중인 요청을 끝낸 뒤 내려가도록, 종료 신호를 받으면 새 요청을 거절하고 진행 중인 요청을 기다린다.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    hikari:
      # 행 잠금(SELECT ... FOR UPDATE)을 기다리는 시간을 5초로 제한한다. Hibernate의 PostgreSQL 방언은 jakarta.persistence.lock.timeout 힌트를 무시하므로, 커넥션에서 직접 제한한다.
      # 제한이 없으면 트랜잭션 하나가 멈출 때 같은 모임의 요청이 커넥션 풀을 대기로 채운다.
      connection-init-sql: SET lock_timeout = '5s'

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# LB 뒤에서 감사 로그에 실제 클라이언트 IP를 남기기 위해, 신뢰하는 프록시가 보낸 X-Forwarded-For만 반영한다.
# TRUSTED_PROXIES가 없으면 Spring Boot 기본값(사설 IP 대역)을 쓴다. 배포 시 LB 대역을 기본값과 같은 쉼표 구분 CIDR 형식으로 넣는다.
server:
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "${TRUSTED_PROXIES:192.168.0.0/16, 172.16.0.0/12, 169.254.0.0/16, fc00::/7, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, fe80::/10, ::1/128}"

access-token:
  secret: ${JWT_SECRET}
  expiration-time: ${ACCESS_TOKEN_EXPIRATION_TIME:7200}

refresh-token:
  expiration-time: ${REFRESH_TOKEN_EXPIRATION_TIME:2592000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

oauth:
  kakao:
    app-id: ${KAKAO_APP_ID}
    access-token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
    user-info-uri: https://kapi.kakao.com/v2/user/me
  google:
    # 앱이 구글 로그인에서 serverClientId로 지정하는 웹 클라이언트 ID다. ID 토큰의 aud가 이 값이어야 한다.
    client-id: ${GOOGLE_CLIENT_ID}
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    issuers:
      - https://accounts.google.com
      - accounts.google.com

# 맛집 검색에 쓰는 NAVER API HUB의 지역 검색이다. 개발자센터에서 발급한 키는 쓸 수 없고, API HUB에서 발급한 Client ID와 Client Secret을 넣는다.
naver:
  local-search:
    client-id: ${NAVER_LOCAL_SEARCH_CLIENT_ID}
    client-secret: ${NAVER_LOCAL_SEARCH_CLIENT_SECRET}
    uri: https://naverapihub.apigw.ntruss.com/search/v1/local

# 카탈로그 적재(./gradlew importCatalog)가 읽는 원본.
# BJCP는 저작권 때문에 커밋하지 않고 scripts/import/fetch-bjcp.sh로 받는다. X-Wines(CC0)는 레포에 커밋되어 있다.
import:
  bjcp:
    path: ${BJCP_PATH:scripts/import/data/bjcp/bjcp_styleguide-2021.json}
  x-wines:
    path: ${X_WINES_PATH:scripts/import/data/x-wines/XWines_Slim_1K_wines.csv}

# 모임 참여자의 이름과 휴대폰을 암호화하는 모임별 데이터 키를 감싸는 마스터 키(base64로 인코딩한 256비트 값).
# `openssl rand -base64 32`로 만든 값을 넣는다. 마스터 키를 바꾸면 이미 감싼 데이터 키를 풀 수 없다.
gathering:
  crypto:
    master-key: ${GATHERING_MASTER_KEY}
  # 개인정보 파기 스윕(#128)의 주기다. 안내하는 보유 기간(최대 30일)보다 하루 일찍 파기 대상이 되므로, 하루 안에 여러 번 돌면 된다.
  purge:
    interval: 1h
