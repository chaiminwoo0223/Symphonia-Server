# 프로파일을 지정하지 않으면 local로 실행한다. dev, prod는 SPRING_PROFILES_ACTIVE로 반드시 지정한다.
spring:
  application:
    name: symphonia
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # 브로커가 받았다고 확인한 메시지만 발행한 것으로 본다. 라우팅되지 않은 메시지는 버리지 않고 돌려받아 발행 실패로 본다.
  # 리스너는 처리를 마친 뒤에 ack하고, 재시도를 다 쓴 메시지는 다시 큐에 넣지 않고 DLQ로 보낸다.
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          # Spring Boot 4부터 max-attempts는 무시되고 첫 시도를 뺀 재시도 횟수를 max-retries로 받는다. 첫 시도를 합쳐 3번 시도한다.
          max-retries: 2
          initial-interval: 1s
          multiplier: 2

# LB 뒤에서 감사 로그에 실제 클라이언트 IP를 남기기 위해, 신뢰하는 프록시가 보낸 X-Forwarded-For만 반영한다.
# TRUSTED_PROXIES가 없으면 Spring Boot 기본값(사설 IP 대역)을 쓴다. 배포 시 LB 대역을 기본값과 같은 쉼표 구분 CIDR 형식으로 넣는다.
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "${TRUSTED_PROXIES:192.168.0.0/16, 172.16.0.0/12, 169.254.0.0/16, fc00::/7, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, fe80::/10, ::1/128}"

access-token:
  secret: ${JWT_SECRET}
  expiration-time: ${ACCESS_TOKEN_EXPIRATION_TIME:7200}

refresh-token:
  expiration-time: ${REFRESH_TOKEN_EXPIRATION_TIME:604800}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    token-uri: https://oauth2.googleapis.com/token
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    issuer: https://accounts.google.com

# 카탈로그 적재(./gradlew importCatalog)가 읽는 원본.
# BJCP는 저작권 때문에 커밋하지 않고 scripts/import/fetch-bjcp.sh로 받는다. X-Wines(CC0)는 레포에 커밋되어 있다.
import:
  bjcp:
    path: ${BJCP_PATH:scripts/import/data/bjcp/bjcp_styleguide-2021.json}
  x-wines:
    path: ${X_WINES_PATH:scripts/import/data/x-wines/XWines_Slim_1K_wines.csv}

# 모임 참여자의 이름과 휴대폰을 암호화하는 모임별 데이터 키를 감싸는 마스터 키(base64로 인코딩한 256비트 값).
# `openssl rand -base64 32`로 만든 값을 넣는다. 마스터 키를 바꾸면 이미 감싼 데이터 키를 풀 수 없다.
gathering:
  crypto:
    master-key: ${GATHERING_MASTER_KEY}
  # 개인정보 파기 스윕(#128)의 주기다. 안내하는 보유 기간(최대 30일)보다 하루 일찍 파기 대상이 되므로, 하루 안에 여러 번 돌면 된다.
  purge:
    interval: 1h

# 정산 메시지 발송(#126, #159). 폴러는 이 주기로 예약 시각이 된 모임과 발행할 발송 기록을 찾는다.
# 개인 링크의 웹 주소(link.base-url)는 환경마다 달라 application-{profile}.yaml에 둔다.
notification:
  poll-interval: 10s
  queue:
    exchange: notification
    delivery: notification.delivery
    dead-letter-exchange: notification.dlx
    dead-letter: notification.delivery.dlq
